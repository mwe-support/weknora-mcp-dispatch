services:
  mcp:
    restart: unless-stopped
    environment:
      MCP_READ_ONLY: "true"
      MCP_AUTH_MODE: "weknora_api_key"
      MCP_HTTP_PATH: "/mcp"
      MCP_API_KEY_VALIDATION_TTL_SECONDS: "60"
      MCP_API_KEY_VALIDATION_CACHE_MAX_ENTRIES: "2048"
      MCP_API_KEY_VALIDATION_MAX_CONCURRENCY: "16"
      MCP_SERVER_AUTH_TOKEN: ""
      WEKNORA_API_KEY: ""
    networks:
      - WeKnora-network
      - kb-backplane

networks:
  kb-backplane:
    external: true
    name: kb-backplane
