services:
  mcp:
    build:
      context: /public/knowledgebase/weknora-mcp-dispatch
      dockerfile: Dockerfile
    image: local/weknora-mcp-dispatch:v0.7.2
    restart: unless-stopped
    environment:
      WEKNORA_BASE_URL: "http://WeKnora-app:8080/api/v1"
      MCP_READ_ONLY: "false"
      MCP_AUTH_MODE: "weknora_api_key"
      MCP_HTTP_PATH: "/mcp"
      MCP_ALLOWED_UPLOAD_DIRS: "/uploads"
      MCP_API_KEY_VALIDATION_TTL_SECONDS: "60"
      MCP_API_KEY_VALIDATION_CACHE_MAX_ENTRIES: "2048"
      MCP_API_KEY_VALIDATION_MAX_CONCURRENCY: "16"
      MCP_SERVER_AUTH_TOKEN: ""
      WEKNORA_API_KEY: ""
    volumes:
      - ${MCP_UPLOAD_HOST_DIR:-/public/knowledgebase/mcp-uploads}:/uploads:ro
    networks:
      - WeKnora-network
      - kb-backplane

networks:
  kb-backplane:
    external: true
    name: kb-backplane
